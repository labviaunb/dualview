[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualview"
version = "1.0.0"
description = "Artery/vein segmentation of fundus photographs with a CNN and a DINOv3 vision transformer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.56",
    "peft>=0.13",
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "pillow",
    "pandas",
    "scikit-learn",
]

[project.urls]
Repository = "https://github.com/labviaunb/dualview"

[tool.setuptools]
packages = ["dualview", "dualview.evaluation"]
